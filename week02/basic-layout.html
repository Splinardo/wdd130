<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Hubert Zachaczewski">
</head>
<body>
    <header>
        <img src="images/basic-logo.png" alt="A picture of a basic logo" width="128" height="128">
    </header>
    <nav>
        <u1><a href="https://byui.edu">BYU-Idaho</a></u1>
        <u2><a href="https://churchofjesuschrist.org">The Church</a></u2>
    </nav>
    <main>
        <h1>"A basic HTML structure"</h1>
        <section><h2>Heading</h2><p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Iure, sequi.</p>
        </section>
        <section><h2>Heading</h2><p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempore, perferendis.</p>
        </section>
    </main>
    <aside>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/adelaide-australia/800x450/adelaide-australia-temple-lds-866420-wallpaper.jpg" alt="Picture of a Temple" width="200">
    </aside>
    <footer>
        <p>Hubert Zachaczewski</p>
    </footer>
</body>
</html>
